<text font-size="8" x="463" y="707" fill="#555">more barriers · equal weighting</text>
</svg>

<script>
const sConn={
  s0:['AW','KN','ED','SC'], s1:['AW','KN','RD','ED','PO','SC'],
  s2:['KN','TR','ED','SC'], s3:['TR','RD','ED','PO','SC'],
  s4:['AW','KN','TR','RD','ED'], s5:['AW','KN','PO','SC'],
  s6:['AW','KN','ED','PO','PA','SC'], s7:['KN','ED','PO','PA','SC'],
  s8:['KN','RD','ED','SC'], s9:['KN','PO','PA','SC'],
  s10:['KN','ED','PA']
};
const cConn={
  AW:['s0','s1','s4','s5','s6'],
  KN:['s0','s1','s2','s4','s5','s6','s7','s8','s9','s10'],
  TR:['s2','s3','s4'], RD:['s1','s3','s4','s8'],
  ED:['s0','s1','s2','s3','s4','s6','s7','s8','s10'],
  PO:['s1','s3','s5','s6','s7','s9'],
  PA:['s6','s7','s9','s10'],
  SC:['s0','s1','s2','s3','s5','s6','s7','s8','s9']
};
const fbFrom={SC:['fb_SC_AW','fb_SC_KN','fb_SC_TR','fb_SC_RD'],PO:['fb_PO_KN','fb_PO_TR','fb_PO_RD'],PA:['fb_PA_AW','fb_PA_RD'],ED:['fb_ED_AW']};
const fbTo={AW:['fb_SC_AW','fb_PA_AW','fb_ED_AW'],KN:['fb_SC_KN','fb_PO_KN'],TR:['fb_SC_TR','fb_PO_TR'],RD:['fb_SC_RD','fb_PO_RD','fb_PA_RD']};
const fbRC_for_BT={AW:['SC','PA','ED'],KN:['SC','PO'],TR:['SC','PO'],RD:['SC','PO','PA']};
const fbBT_for_RC={SC:['AW','KN','TR','RD'],PO:['KN','TR','RD'],PA:['AW','RD'],ED:['AW']};

function reset(){
  document.querySelectorAll('.stream,.feedback').forEach(l=>l.classList.remove('active','dim'));
  document.querySelectorAll('.sb,.cb').forEach(b=>b.classList.remove('dim','highlighted','selected'));
}
function hlS(s){
  reset();
  const linked=sConn[s]||[];
  document.querySelectorAll('.stream').forEach(el=>{const m=el.getAttribute('data-s')===s;el.classList.toggle('active',m);el.classList.toggle('dim',!m);});
  document.querySelectorAll('.feedback').forEach(el=>el.classList.add('dim'));
  document.querySelectorAll('.sb').forEach(el=>{el.classList.toggle('selected',el.id==='s'+s);el.classList.toggle('dim',el.id!=='s'+s);});
  document.querySelectorAll('.cb').forEach(el=>{const c=el.id.replace('c','');if(linked.includes(c)){el.classList.add('highlighted');}else{el.classList.add('dim');}});
}
function hlC(c){
  reset();
  const linked=cConn[c]||[];
  const isRC=['ED','PO','PA','SC'].includes(c);
  const isBT=['AW','KN','TR','RD'].includes(c);
  document.querySelectorAll('.stream').forEach(el=>{const m=el.getAttribute('data-c')===c;el.classList.toggle('active',m);el.classList.toggle('dim',!m);});
  const activeFB=isRC?(fbFrom[c]||[]):isBT?(fbTo[c]||[]):[];
  document.querySelectorAll('.feedback').forEach(el=>{const m=activeFB.includes(el.id);el.classList.toggle('active',m);el.classList.toggle('dim',!m);});
  document.querySelectorAll('.cb').forEach(el=>{
    const ec=el.id.replace('c','');
    const fbLinked=isRC?(fbBT_for_RC[c]||[]):isBT?(fbRC_for_BT[c]||[]):[];
    if(ec===c){el.classList.add('selected');}
    else if(linked.includes(ec)||fbLinked.includes(ec)){el.classList.add('highlighted');}
    else{el.classList.add('dim');}
  });
  document.querySelectorAll('.sb').forEach(el=>{const sid=el.id.replace('s','');if(linked.includes(sid)){el.classList.add('highlighted');}else{el.classList.add('dim');}});
}
document.querySelector('svg').addEventListener('click',e=>{if(!e.target.closest('.sb')&&!e.target.closest('.cb'))reset();});
</script>
</body>
</html>
