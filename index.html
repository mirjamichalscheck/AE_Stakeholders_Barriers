<style>
  body { margin: 0; padding: 8px; font-family: var(--font-sans, sans-serif); background: transparent; }
  svg { display: block; width: 100%; }
  .stream { fill: none; opacity: 0.32; transition: opacity 0.2s; cursor: pointer; }
  .stream:hover, .stream.active { opacity: 0.88; }
  .stream.dim { opacity: 0.04; }
  .feedback { fill: none; opacity: 0.4; transition: opacity 0.2s; cursor: pointer; }
  .feedback:hover, .feedback.active { opacity: 0.85; }
  .feedback.dim { opacity: 0.04; }

  /* Stakeholder boxes */
  .sb { cursor: pointer; transition: opacity 0.2s; }
  .sb rect { transition: opacity 0.2s, filter 0.2s; }
  .sb text { transition: opacity 0.2s; }
  .sb.dim rect { opacity: 0.15; }
  .sb.dim text { opacity: 0.15; }
  .sb.highlighted rect { filter: brightness(0.88); stroke-width: 2.2 !important; }

  /* Cluster boxes */
  .cb { cursor: pointer; transition: opacity 0.2s; }
  .cb rect { transition: opacity 0.2s, filter 0.2s; }
  .cb text { transition: opacity 0.2s; }
  .cb.dim rect { opacity: 0.15; }
  .cb.dim text { opacity: 0.15; }
  .cb.highlighted rect { filter: brightness(0.88); stroke-width: 2.2 !important; }
  .cb.selected rect { filter: brightness(0.82); stroke-width: 2.8 !important; }

  .s-label { font-size: 10px; font-weight: 600; font-family: inherit; text-anchor: middle; dominant-baseline: middle; fill: #0A2A4A; }
  .cl-label { font-size: 9.5px; font-weight: 600; font-family: inherit; text-anchor: middle; dominant-baseline: middle; }
  .group-label { font-size: 9px; font-weight: 700; font-family: inherit; text-anchor: middle; }
</style>

<script>
const sConn={
  s0:['AW','KN','ED','SC'], s1:['AW','KN','RD','ED','PO','SC'],
  s2:['KN','TR','ED','SC'], s3:['TR','RD','ED','PO','SC'],
  s4:['AW','KN','TR','RD','ED'], s5:['AW','KN','PO','SC'],
  s6:['AW','KN','ED','PO','PA','SC'], s7:['KN','ED','PO','PA','SC'],
  s8:['KN','RD','ED','SC'], s9:['KN','PO','PA','SC'],
  s10:['KN','ED','PA']
};
const cConn={
  AW:['s0','s1','s4','s5','s6'],
  KN:['s0','s1','s2','s4','s5','s6','s7','s8','s9','s10'],
  TR:['s2','s3','s4'], RD:['s1','s3','s4','s8'],
  ED:['s0','s1','s2','s3','s4','s6','s7','s8','s10'],
  PO:['s1','s3','s5','s6','s7','s9'],
  PA:['s6','s7','s9','s10'],
  SC:['s0','s1','s2','s3','s5','s6','s7','s8','s9']
};
const fbFrom={ SC:['fb_SC_AW','fb_SC_KN','fb_SC_TR','fb_SC_RD'], PO:['fb_PO_KN','fb_PO_TR','fb_PO_RD'], PA:['fb_PA_AW','fb_PA_RD'], ED:['fb_ED_AW'] };
const fbTo={ AW:['fb_SC_AW','fb_PA_AW','fb_ED_AW'], KN:['fb_SC_KN','fb_PO_KN'], TR:['fb_SC_TR','fb_PO_TR'], RD:['fb_SC_RD','fb_PO_RD','fb_PA_RD'] };
// which clusters are connected via feedback arcs
const fbRC_for_BT={ AW:['SC','PA','ED'], KN:['SC','PO'], TR:['SC','PO'], RD:['SC','PO','PA'] };
const fbBT_for_RC={ SC:['AW','KN','TR','RD'], PO:['KN','TR','RD'], PA:['AW','RD'], ED:['AW'] };

function reset(){
  document.querySelectorAll('.stream,.feedback').forEach(l=>l.classList.remove('active','dim'));
  document.querySelectorAll('.sb,.cb').forEach(b=>b.classList.remove('dim','highlighted','selected'));
}

function hlS(s){
  reset();
  const linked=sConn[s]||[];
  // streams
  document.querySelectorAll('.stream').forEach(el=>{
    const m=el.getAttribute('data-s')===s;
    el.classList.toggle('active',m); el.classList.toggle('dim',!m);
  });
  // dim all feedbacks
  document.querySelectorAll('.feedback').forEach(el=>el.classList.add('dim'));
  // stakeholder boxes
  document.querySelectorAll('.sb').forEach(el=>{
    if(el.id==='s'+s){ el.classList.add('selected'); }
    else { el.classList.add('dim'); }
  });
  // cluster boxes: highlight connected, dim others
  document.querySelectorAll('.cb').forEach(el=>{
    const c=el.id.replace('c','');
    if(linked.includes(c)){ el.classList.add('highlighted'); }
    else { el.classList.add('dim'); }
  });
}

function hlC(c){
  reset();
  const linked=cConn[c]||[];
  const isRC=['ED','PO','PA','SC'].includes(c);
  const isBT=['AW','KN','TR','RD'].includes(c);
  // streams
  document.querySelectorAll('.stream').forEach(el=>{
    const m=el.getAttribute('data-c')===c;
    el.classList.toggle('active',m); el.classList.toggle('dim',!m);
  });
  // feedback arcs
  const activeFB=isRC?(fbFrom[c]||[]):isBT?(fbTo[c]||[]):[];
  document.querySelectorAll('.feedback').forEach(el=>{
    const m=activeFB.includes(el.id);
    el.classList.toggle('active',m); el.classList.toggle('dim',!m);
  });
  // selected cluster box
  document.querySelectorAll('.cb').forEach(el=>{
    const ec=el.id.replace('c','');
    if(ec===c){
      el.classList.add('selected');
    } else {
      // also highlight feedback-connected clusters
      const fbLinked=isRC?(fbBT_for_RC[c]||[]):isBT?(fbRC_for_BT[c]||[]):[];
      if(linked.includes(ec)||fbLinked.includes(ec)){
        el.classList.add('highlighted');
      } else {
        el.classList.add('dim');
      }
    }
  });
  // stakeholder boxes
  document.querySelectorAll('.sb').forEach(el=>{
    const sid=el.id.replace('s','');
    if(linked.includes(sid)){ el.classList.add('highlighted'); }
    else { el.classList.add('dim'); }
  });
}

document.querySelector('svg').addEventListener('click',e=>{
  if(!e.target.closest('.sb')&&!e.target.closest('.cb')) reset();
});
</script>
</body>
</html>
