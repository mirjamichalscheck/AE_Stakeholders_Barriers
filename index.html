  SC:['s0','s1','s2','s3','s5','s6','s7','s8','s9','s10']
};
const fbConn = {
  SC:['AW','KN','TR','RD'], PO:['KN','TR','RD'],
  PA:['AW','RD'], ED:['AW']
};
const btFromRC = {
  AW:['SC','PA','ED'], KN:['SC','PO'], TR:['SC','PO'], RD:['SC','PO','PA']
};

function hlS(s){
  const linked=sConn[s]||[];
  document.querySelectorAll('.stream').forEach(el=>{
    const m=el.getAttribute('data-s')===s;
    el.classList.toggle('active',m); el.classList.toggle('dim',!m);
  });
  document.querySelectorAll('.feedback').forEach(el=>el.classList.add('dim'));
  document.querySelectorAll('.sb').forEach(el=>el.classList.toggle('dim',el.id!=='s'+s));
  document.querySelectorAll('.cb').forEach(el=>el.classList.toggle('dim',!linked.includes(el.id.replace('c',''))));
}
function hlC(c){
  const linked=cConn[c]||[];
  const isBT=['AW','KN','TR','RD'].includes(c);
  const isRC=['ED','PO','PA','SC'].includes(c);
  document.querySelectorAll('.stream').forEach(el=>{
    const m=el.getAttribute('data-c')===c;
    el.classList.toggle('active',m); el.classList.toggle('dim',!m);
  });
  document.querySelectorAll('.feedback').forEach(el=>{
    const id=el.id;
    let match=false;
    if(isRC && id.startsWith('fb_'+c+'_')) match=true;
    if(isBT && id.endsWith('_'+c)) match=true;
    el.classList.toggle('active',match); el.classList.toggle('dim',!match);
  });
  document.querySelectorAll('.cb').forEach(el=>el.classList.toggle('dim',el.id!=='c'+c));
  document.querySelectorAll('.sb').forEach(el=>el.classList.toggle('dim',!linked.includes(el.id.replace('s',''))));
}
document.querySelector('svg').addEventListener('click',e=>{
  if(!e.target.closest('.sb')&&!e.target.closest('.cb')){
    document.querySelectorAll('.stream,.feedback').forEach(l=>l.classList.remove('active','dim'));
    document.querySelectorAll('.sb,.cb').forEach(b=>b.classList.remove('dim'));
  }
});
</script>
</body>
</html>
